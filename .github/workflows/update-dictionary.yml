name: Update SKK dictionary

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday 03:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download upstream SKK-JISYO.L (EUC-JP)
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/skk-dev/dict/master/SKK-JISYO.L" \
            -o SKK-JISYO.L

      - name: Get upstream commit info
        id: upstream
        run: |
          INFO=$(curl -fsSL \
            "https://api.github.com/repos/skk-dev/dict/commits?path=SKK-JISYO.L&per_page=1" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
          SHA=$(echo "$INFO" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d[0]['sha'][:8])")
          DATE=$(echo "$INFO" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d[0]['commit']['committer']['date'][:10])")
          echo "sha=$SHA"   >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Convert EUC-JP → UTF-8
        run: |
          iconv -f EUC-JP -t UTF-8 SKK-JISYO.L \
            > skk.koplugin/SKK-JISYO.utf8.new
          rm SKK-JISYO.L

      - name: Check for changes
        id: diff
        run: |
          # Strip the EUC-JP encoding declaration (first line always changes
          # after iconv); compare only the dictionary content.
          tail -n +2 skk.koplugin/SKK-JISYO.utf8     > /tmp/old.txt
          tail -n +2 skk.koplugin/SKK-JISYO.utf8.new > /tmp/new.txt

          if diff -q /tmp/old.txt /tmp/new.txt > /dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
            rm skk.koplugin/SKK-JISYO.utf8.new
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            ADDED=$(diff /tmp/old.txt /tmp/new.txt | grep -c '^>' || true)
            REMOVED=$(diff /tmp/old.txt /tmp/new.txt | grep -c '^<' || true)
            echo "added=$ADDED"     >> $GITHUB_OUTPUT
            echo "removed=$REMOVED" >> $GITHUB_OUTPUT
            mv skk.koplugin/SKK-JISYO.utf8.new skk.koplugin/SKK-JISYO.utf8
          fi

      - name: Bump patch version in _meta.lua
        if: steps.diff.outputs.changed == 'true'
        run: |
          CURRENT=$(grep -oP 'version\s*=\s*"\K[^"]+' skk.koplugin/_meta.lua)
          NEW=$(echo "$CURRENT" | awk -F. '{print $1"."$2"."$3+1}')
          sed -i "s/version  = \"$CURRENT\"/version  = \"$NEW\"/" skk.koplugin/_meta.lua
          echo "Bumped $CURRENT → $NEW"

      - name: Commit and push directly to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW=$(grep -oP 'version\s*=\s*"\K[^"]+' skk.koplugin/_meta.lua)
          git add skk.koplugin/SKK-JISYO.utf8 skk.koplugin/_meta.lua
          git commit -m "chore: update dictionary + bump to v${NEW} (${{ steps.upstream.outputs.date }})

          Source: skk-dev/dict@${{ steps.upstream.outputs.sha }}
          Entries added: ${{ steps.diff.outputs.added }}
          Entries removed: ${{ steps.diff.outputs.removed }}"
          git push origin main
